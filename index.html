<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Marketplace</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<style>
body{font-family:'Sora',sans-serif;background:#F4F3EF;margin:0}
.header{background:#fff;padding:16px 24px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}
.filters{background:#fff;padding:12px 24px;border-bottom:1px solid #ddd;display:flex;gap:8px;flex-wrap:wrap}
button{padding:8px 14px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer}
.content{padding:24px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.card{background:#fff;padding:16px;border-radius:10px;border:1px solid #ddd}
.err{color:red}
</style>
</head>

<body>

<div class="header">
  <strong>Marketplace Dashboard</strong>
  <span id="last-update">—</span>
</div>

<div class="filters">
  <button onclick="document.getElementById('csv').click()">⬆️ Carregar CSV</button>
  <input type="file" id="csv" accept=".csv" style="display:none" onchange="loadCSV(event)">
</div>

<div class="content">
  <div id="app">Carregue um CSV</div>
</div>

<script>

// ───────────── UTIL ─────────────
function normalizeKey(k){
  return k.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s/g,'');
}

function get(r, keys){
  const map = {};
  Object.keys(r).forEach(k=> map[normalizeKey(k)] = r[k]);
  for(let k of keys){
    if(map[normalizeKey(k)] !== undefined) return map[normalizeKey(k)];
  }
  return null;
}

function n(v){
  if(!v && v!==0) return 0;
  return parseFloat(String(v).replace(/[R$\s%]/g,'').replace(',','.')) || 0;
}

function pd(s){
  if(!s) return null;
  let m = String(s).match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if(m) return new Date(m[3], m[2]-1, m[1]);
  return null;
}

// ───────────── GLOBAL ─────────────
let raw = [], chart;

// ───────────── LOAD CSV ─────────────
function loadCSV(e){
  const file = e.target.files[0];
  if(!file) return;

  document.getElementById('app').innerHTML = 'Processando CSV...';

  Papa.parse(file,{
    header:true,
    skipEmptyLines:true,
    complete: res=>{
      try{

        raw = res.data.map(r=>{

          const dt = pd(get(r,['data']));
          const rec = n(get(r,['receita(t)','receita (t)','receita']));
          const mc = n(get(r,['mc_ajustado','mc']));
          const custo = n(get(r,['custo']));
          const plat = get(r,['plataforma']);
          const sku = get(r,['sku','sku_ajustado']) || 'Sem SKU';

          if(!dt || rec<=0) return null;

          return {dt,rec,mc,custo,plat,sku};

        }).filter(Boolean);

        if(!raw.length) throw new Error();

        render();

      }catch{
        document.getElementById('app').innerHTML =
          '<div class="err">Nenhum dado válido encontrado</div>';
      }
    }
  });
}

// ───────────── RENDER ─────────────
function render(){

  const total = raw.reduce((s,r)=>s+r.rec,0);
  const mc = raw.reduce((s,r)=>s+r.mc,0);

  const last = raw.sort((a,b)=>b.dt-a.dt)[0].dt;
  document.getElementById('last-update').innerText =
    'Atualizado: ' + last.toLocaleDateString('pt-BR');

  document.getElementById('app').innerHTML = `
    <div class="kpis">
      <div class="card">Receita<br><strong>R$ ${total.toLocaleString('pt-BR')}</strong></div>
      <div class="card">MC<br><strong>R$ ${mc.toLocaleString('pt-BR')}</strong></div>
      <div class="card">Pedidos<br><strong>${raw.length}</strong></div>
      <div class="card">Ticket Médio<br><strong>R$ ${(total/raw.length).toFixed(2)}</strong></div>
    </div>
    <canvas id="chart" height="100"></canvas>
  `;

  const byMonth = {};
  raw.forEach(r=>{
    const key = r.dt.getMonth()+1;
    byMonth[key] = (byMonth[key]||0)+r.rec;
  });

  if(chart) chart.destroy();

  chart = new Chart(document.getElementById('chart'),{
    type:'bar',
    data:{
      labels:Object.keys(byMonth),
      datasets:[{
        label:'Receita',
        data:Object.values(byMonth)
      }]
    }
  });
}

</script>

</body>
</html>

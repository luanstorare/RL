<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Marketplace</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<style>
body{font-family:'Sora',sans-serif;background:#F4F3EF;margin:0}
.header{background:#fff;padding:15px 20px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}
.filters{background:#fff;padding:10px 20px;border-bottom:1px solid #ddd}
button{padding:8px 14px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer}
.content{padding:20px}
.kpi{font-size:22px;margin-bottom:20px}
.err{color:red}
</style>
</head>

<body>

<div class="header">
  <strong>Marketplace Dashboard</strong>
  <span id="last-update">—</span>
</div>

<div class="filters">
  <button onclick="document.getElementById('csv').click()">⬆️ Carregar CSV</button>
  <input type="file" id="csv" accept=".csv" style="display:none" onchange="loadCSV(event)">
</div>

<div class="content">
  <div id="app">Carregue um CSV</div>
</div>

<script>

let data = [];

// ─── NORMALIZA HEADER ─────────────────────────────
function normalizeKey(k){
  return k
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/\s/g,'');
}

// ─── BUSCA FLEXÍVEL ─────────────────────────────
function get(r, keys){
  const map = {};
  Object.keys(r).forEach(k=>{
    map[normalizeKey(k)] = r[k];
  });

  for(let k of keys){
    const val = map[normalizeKey(k)];
    if(val !== undefined) return val;
  }
  return null;
}

// ─── PARSE NUM ─────────────────────────────
function n(v){
  if(!v && v!==0) return 0;
  return parseFloat(String(v).replace(/[R$\s%]/g,'').replace(',','.')) || 0;
}

// ─── DATA ─────────────────────────────
function pd(s){
  if(!s) return null;
  let m = s.match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if(m) return new Date(m[3], m[2]-1, m[1]);
  return null;
}

// ─── LOAD CSV ─────────────────────────────
function loadCSV(e){
  const file = e.target.files[0];
  if(!file) return;

  document.getElementById('app').innerHTML = 'Processando...';

  Papa.parse(file,{
    header:true,
    skipEmptyLines:true,
    complete: res=>{
      try{

        data = res.data.map(r=>{

          const dt = pd(get(r,['data']));
          const rec = n(get(r,['receita(t)','receita (t)','receita']));

          if(!dt || rec<=0) return null;

          return {
            dt,
            rec
          };

        }).filter(Boolean);

        if(!data.length) throw new Error('Nenhum dado válido');

        render();

      }catch(err){
        document.getElementById('app').innerHTML =
          '<div class="err">Nenhum dado válido encontrado. Verifique o CSV.</div>';
      }
    }
  });
}

// ─── RENDER ─────────────────────────────
function render(){

  const total = data.reduce((s,r)=>s+r.rec,0);

  const last = data.sort((a,b)=>b.dt-a.dt)[0].dt;
  document.getElementById('last-update').innerText =
    'Atualizado: ' + last.toLocaleDateString('pt-BR');

  document.getElementById('app').innerHTML = `
    <div class="kpi">Receita Total: R$ ${total.toLocaleString('pt-BR')}</div>
    <canvas id="chart" height="100"></canvas>
  `;

  const byMonth = {};

  data.forEach(r=>{
    const m = r.dt.getMonth()+1;
    byMonth[m] = (byMonth[m]||0)+r.rec;
  });

  new Chart(document.getElementById('chart'),{
    type:'bar',
    data:{
      labels:Object.keys(byMonth),
      datasets:[{data:Object.values(byMonth)}]
    }
  });
}

</script>

</body>
</html>
